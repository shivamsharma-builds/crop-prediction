services:
  - type: web
    name: cropwise
    runtime: node
    plan: free
    region: oregon
    buildCommand: >-
      npm ci --prefix backend &&
      npm ci --prefix frontend &&
      npm run build --prefix frontend &&
      npm run build --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CONFIG_ENCRYPTION_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_APP_NAME
        value: CropWise
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: CropWise Admin
      - key: COOKIE_SECURE
        value: "true"
